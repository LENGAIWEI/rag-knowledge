spring.application.name=rag-knowledge

server.port=8081

# =====================================================================
# 密钥说明（重要）
# ---------------------------------------------------------------------
# 本文件会提交到 Git 仓库，因此**绝不能**把真实 Key 写在这里。
# 三种提供 Key 的方式，任选其一：
#   1) 环境变量（部署到服务器推荐）
#        AI_API_KEY=sk-xxx
#        AI_EMBEDDING_API_KEY=xxx
#      Spring Boot 的松绑定会自动把 AI_API_KEY 映射到 ai.api-key。
#   2) 本地配置文件（开发推荐）
#        复制 application-local.properties.example 为 application-local.properties，
#        填上真实 Key。该文件已在 .gitignore 中，不会被提交。
#   3) 页面右上角「设置」里直接填（仅本次运行有效，不落盘，重启即失效）
#
# 若三处都没配置，应用仍可启动，只是「设置」页会提示未配置。
# =====================================================================

# 对话模型（用于改写问题 + 依据片段作答）
ai.api-key=${AI_API_KEY:}
ai.api-url=https://api.deepseek.com/v1/chat/completions
ai.model=deepseek-chat

# 向量化 Embedding（与对话模型是两套独立接口和 Key）
ai.embedding-api-key=${AI_EMBEDDING_API_KEY:}
ai.embedding-api-url=https://open.bigmodel.cn/api/paas/v4/embeddings
ai.embedding-model=embedding-3

# 引入本地密钥文件；文件不存在时静默跳过，不影响启动
spring.config.import=optional:file:./application-local.properties

# ===================== 切段 =====================
# chunk-size：单个知识块目标字数；chunk-overlap：相邻块重叠字数（避免跨块问题丢上下文）
# 若文档是 Markdown，会先按 # 标题切成章节，章节路径作为元数据一并入库并可被检索。
kb.chunk-size=300
kb.chunk-overlap=60
kb.batch-size=8
kb.store-path=data/knowledge-base.json

# ===================== 第 1 层：混合检索（向量 + BM25 → RRF 融合）=====================
kb.hybrid.enabled=true
# 每一路各自召回的候选条数（向量 topN、BM25 topN）
kb.recall.top-k=10
# 向量路召回门槛（余弦相似度），低于它的段落不进候选池；0 表示不过滤
kb.recall.min-vector-score=0.25
# RRF 公式 score = Σ weight / (k + rank) 中的 k，经验值 60
kb.rrf.k=60
kb.rrf.vector-weight=1.0
kb.rrf.bm25-weight=1.0

# ===================== 第 2 层：精排 Rerank =====================
# 最终送入大模型的片段数
kb.top-k=5
# 送入精排的候选数（从融合结果里取前 N 条）
kb.rerank.candidates=20
# off=不精排；local=纯 Java 本地精排；http=调用 bge-reranker 服务；auto=配了 api-url 用 http，否则 local
kb.rerank.mode=auto
# 精排后的最终分阈值：低于它的候选直接丢弃，全部低于则拒答（0 表示不过滤）
kb.rerank.min-score=0.15
# 指向本地 bge-reranker 推理服务（Jina / Cohere / SiliconFlow / TEI 兼容的 /rerank 协议）
kb.rerank.api-url=
kb.rerank.api-key=
kb.rerank.model=bge-reranker-v2-m3
kb.rerank.timeout-ms=8000
# local 精排的特征权重（会自动归一化，无需凑成 1）
kb.rerank.lexical.weight-vector=0.30
kb.rerank.lexical.weight-coverage=0.25
kb.rerank.lexical.weight-proximity=0.20
kb.rerank.lexical.weight-phrase=0.15
kb.rerank.lexical.weight-bm25=0.10

# ===================== 第 3 层：Query 改写 / HyDE =====================
# 改写：让 LLM 把口语化问题改写成独立检索式，并生成同义变体（多查询扩展）
kb.rewrite.enabled=true
# 额外生成的同义改写条数（0 表示只做指代消解，不扩展）
kb.rewrite.variants=2
# 主查询 / 改写查询 / 变体查询 在 RRF 融合时的权重
kb.rewrite.standalone-weight=0.9
kb.rewrite.variant-weight=0.6
# HyDE：先让 LLM 生成假设答案，再用假设答案的向量去检索（默认关，会多一次 LLM 调用）
kb.hyde.enabled=false
kb.hyde.weight=0.8
kb.hyde.max-chars=400

# ===================== 文件上传限制 =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
